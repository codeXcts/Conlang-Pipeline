<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="build 2026-11-11-1457">
<title>Conlang Pipeline</title>
<style>
:root{
  --bg:#f6f3ed;--panel:#fffdf9;--ink:#1f1d1a;--muted:#6d675e;--line:#e2dbcf;
  --accent:#2d6a5e;--accent-ink:#fff;--accent-soft:#e1eeea;
  --warn:#9a4d17;--warn-soft:#fbede0;--err:#a12a2a;--err-soft:#f8e3e3;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Noto Serif","Noto Sans","Segoe UI","Lucida Grande",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614;--panel:#211f1c;--ink:#ece7de;--muted:#a49e93;--line:#38332d;
  --accent:#71c2ac;--accent-ink:#0f201b;--accent-soft:#1f3631;
  --warn:#e6a56c;--warn-soft:#3a2a1c;--err:#ee9090;--err-soft:#3b1f1f;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
.ipa{font-family:var(--ipa)}

header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
#langName{flex:1;min-width:0;font-weight:650;font-size:18px;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px}
#langName:focus{outline:none;border-color:var(--line);background:var(--panel)}
#langName::placeholder{color:var(--muted);font-weight:500}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.bad{color:var(--err)}
.iconbtn{flex:none;width:42px;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:20px;line-height:1}

#banner:empty{display:none}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner .grow{flex:1;min-width:180px}
.banner button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:4px 10px;font-size:14px}

main{max-width:980px;margin:0 auto;padding:16px 12px 40px}
.stagehead .step{font-size:13px;color:var(--muted);letter-spacing:.02em}
.stagehead h1{margin:2px 0 4px;font-size:26px}
.stagehead p{margin:0 0 14px;color:var(--muted)}

.inv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.inv .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.inv .row b{font-size:13px;color:var(--muted);font-weight:600;width:112px;white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 9px;font-family:var(--ipa);font-size:18px;min-width:34px}
.chip.custom{border-style:dashed}
.inv .none{font-size:14px;color:var(--muted)}
.inv .tip{font-size:12px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toolbar .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--err);border-color:var(--err)}

h2{font-size:19px;margin:22px 0 4px}
h3{font-size:15px;margin:16px 0 2px}
.ghint{font-size:13px;color:var(--muted);margin:0 0 8px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:104px;padding:10px 6px 8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;text-align:center}
.tile .sym{font-family:var(--ipa);font-size:28px;line-height:1.15}
.tile .lab{font-size:12px;font-weight:600;line-height:1.2}
.tile .ex{font-size:11.5px;color:var(--muted);line-height:1.2}
.tile.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.custom{border-style:dashed}
.tile .corner{position:absolute;top:4px;right:4px;display:flex;gap:2px}
.tile .corner span{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:13px;color:var(--accent);background:var(--panel);border:1px solid var(--line)}
.tile .slot{position:absolute;top:4px;left:4px;width:26px;height:26px}
.tile .slot .play{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:11px;color:var(--accent);background:var(--panel);border:1px solid var(--line)}

.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.chart{border-collapse:collapse;font-size:12px;min-width:100%}
table.chart th,table.chart td{border:1px solid var(--line);padding:4px;vertical-align:middle;text-align:center}
table.chart thead th{font-weight:600;color:var(--muted);white-space:nowrap;background:var(--bg)}
table.chart tbody th{position:sticky;left:0;background:var(--bg);text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;z-index:1}
table.chart td{min-width:64px;white-space:nowrap}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:34px;margin:1px;padding:0 5px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--ipa);font-size:19px}
.mini.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.custom{border-style:dashed}
.chartnote{font-size:12px;color:var(--muted);margin:6px 2px 0}

.stagebtn{border:0;background:transparent;padding:4px 0;font-size:13px;color:var(--muted);letter-spacing:.02em}
.stagenav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.stagenav .spacer{flex:1}
.rowcard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.rowcard .grow{flex:1;min-width:0;display:block}
.blk{display:block}
.clsL{font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:22px}
.members{font-family:var(--ipa);font-size:18px;line-height:1.5;word-break:break-word}
.members .gone{color:var(--err)}
.patsrc{display:block;font:600 19px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
.shapes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.shapechip{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:1px 7px;font-size:13px}
.shapechip b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.small{font-size:12.5px}
.warn-text{color:var(--warn);font-size:13px}
.wt{font-size:12px;color:var(--muted);white-space:nowrap}
.linkbtn{border:0;background:transparent;color:var(--accent);padding:0;font-size:14px;text-decoration:underline}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 3px;vertical-align:middle}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:19px}
.stepper b{min-width:20px;text-align:center}
.rlline{margin:4px 0 8px;line-height:2.6}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.missing{border-color:var(--err);text-decoration:line-through}
.sheet .menuitem[disabled]{opacity:.45;cursor:default}
.field input.mono{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.sheet .inv .row b{width:96px}
.sptable{display:grid;gap:6px}
.sprow{display:grid;grid-template-columns:52px minmax(0,140px) 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sprow .sym{font-size:22px;text-align:center}
.sprow input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:17px}
.rulerow{align-items:center}
.rulerow .plain{border:0;background:transparent;text-align:left;padding:0}
.updown{display:flex;flex-direction:column;gap:4px}
.updown button{width:34px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:7px}
.updown button[disabled]{opacity:.35}
.spellout{font-size:22px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.pathcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;margin:0 0 12px;font-size:15px;line-height:1.45}
.pathcard b{display:block;font-size:19px;margin-bottom:4px}
.pathcard:active{border-color:var(--accent)}
details.cc{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 12px;margin:8px 0 10px}
details.cc summary{font-weight:600;cursor:pointer;padding:2px 0}
.ccrow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0}
.ccrow .grow{flex:1;min-width:0}
.ccst{text-align:right;max-width:40%}
.okmark{color:var(--accent);font-size:13px;white-space:nowrap}
.btn.small{padding:4px 9px;font-size:13px}
.linked{color:var(--accent)}
.guiderow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:7px 0}
.shares{margin:2px 0 6px;line-height:1.9}
.freqrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;margin:3px 0}
.freqrow.off .fnum{color:var(--warn)}
.fsym{font-size:18px;text-align:center}
.bars{display:grid;gap:2px}
.bar{display:block;height:7px;border-radius:4px;min-width:2px}
.bar.exp{background:var(--line)}
.bar.act{background:var(--accent)}
.fnum{white-space:nowrap;color:var(--muted)}
.twinlist{display:grid;gap:4px;font-size:15px}
.sheet h3{margin:16px 0 6px}
.vcard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 14px 18px;margin:10px 0 12px;text-align:center}
.vcard.locked{border-color:var(--accent)}
.vmeta{font-size:16px}
.vword{display:block;font-size:44px;font-weight:650;line-height:1.15;margin:14px 0 4px;text-align:center;word-break:break-all}
.vipa{font-size:17px;color:var(--muted)}
.vcard button.vword{text-align:center;width:100%}
.badge{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.sheettext{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.btn[disabled]{opacity:.4}
.mlist{display:grid;gap:5px}
.mrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px}
.mrow .rank{min-width:28px;color:var(--muted);font-size:13px;padding-top:2px;text-align:right}
.mrow .grow{flex:1;min-width:0}
.poschip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}
.learned{font-size:12px;color:var(--accent)}
.up{color:var(--accent);font-family:system-ui,sans-serif;font-size:12px}
.down{color:var(--err);font-family:system-ui,sans-serif;font-size:12px}
.posrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.posrow input,.posrow select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.calcard{text-align:center;padding:26px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin:6px 0 12px}
.calword{font-size:40px;font-weight:650;line-height:1.2;word-break:break-all}
.calbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{padding:16px;font-size:18px;font-weight:600}
.newm{color:var(--accent);font-weight:600}
.addany{display:flex;gap:8px;margin:8px 0}
.addany input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:18px}
.tick{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:15px}
.tick input{width:20px;height:20px;accent-color:var(--accent)}
.keypad{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 8px}
.keypad button{min-width:40px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--ipa);font-size:18px}
.switchrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.switchrow input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.dim{opacity:.55}
.era{border-left:3px solid var(--line);padding-left:10px;margin:12px 0}
.erahead{display:flex;align-items:baseline;gap:10px}
.erahead h3{margin:6px 0}
.pct{font-size:12px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:0 5px;vertical-align:middle}
.chip.new{border-color:var(--accent)}
.chip.lost{text-decoration:line-through;opacity:.6}
.chip .flag{font-family:system-ui,sans-serif;font-size:11px;color:var(--warn)}
.twlist{display:grid;gap:6px}
.rowcard.tw{align-items:baseline;flex-wrap:wrap;gap:6px;font-size:17px}
.rowcard.tw.moved{border-color:var(--accent)}
.rowcard.tw .spelled{margin-left:auto}
ol.trace{margin:4px 0;padding-left:20px;font-size:15px}
ol.trace li{margin:6px 0}
button.plain{border:0;background:transparent;padding:0;text-align:left;width:100%;color:inherit}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.wcard{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 40px 10px 12px;min-height:84px}
.wcard.on{border-color:var(--accent);background:var(--accent-soft)}
.wcard .word{font-size:26px;line-height:1.2;word-break:break-all}
.wcard .star{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;background:transparent;font-size:22px;color:var(--accent);line-height:1}
footer.build{text-align:center;font-size:12px;color:var(--muted);padding:0 12px 28px}

/* menu + modal */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
@media (min-width:640px){#overlay{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h2{margin:0 0 10px}
.sheet .menuitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 4px;font-size:16px}
.sheet .menuitem small{display:block;color:var(--muted);font-size:13px}
.sheet .menuitem:last-of-type{border-bottom:0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input[type=text],.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.field input.ipa{font-size:22px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.actions .left{margin-right:auto}
.err-text{color:var(--err);font-size:14px;margin:6px 0 0;display:block}
.list{margin:6px 0 0;padding-left:18px;font-size:14px}
.list li{margin:3px 0}
.okline{padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.errline{padding:10px 12px;border-radius:10px;background:var(--err-soft);color:var(--err);font-size:14px}
.warnline{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:10px 0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}

#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<header class="top">
  <input id="langName" type="text" placeholder="Untitled language" autocomplete="off" spellcheck="false" aria-label="Language name">
  <span id="saveState"></span>
  <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
</header>
<div id="banner"></div>
<main id="main"></main>
<footer class="build" id="buildLine"></footer>
<div id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
"use strict";
/* ============================================================
   Conlang Pipeline — build 2026-11-11-1457 (made on build 2026-11-10-2321)
   Fully offline. No network calls, no accounts, no AI.
   ============================================================ */
const BUILD = "build 2026-11-11-1457";
const BASE_BUILD = "build 2026-11-10-2321";
const FORMAT = "conlang-pipeline";
const VERSION = 3;
const STORE_KEY = "conlang-pipeline:autosave";
const META_KEY = "conlang-pipeline:meta";   // { lastExport, dirtySince } — tool state, not language data
const UI_KEY = "conlang-pipeline:ui";       // { soundView } — tool state, not language data
const REMIND_AFTER_MS = 3 * 24 * 3600 * 1000; // export reminder after 3 days of unexported changes

/* ---------------- Data layer: canonical skeleton ---------------- */
function skeleton() {
  return {
    format: FORMAT,
    version: VERSION,
    language: { name: "", notes: "" },
    sounds: { consonants: {}, vowels: {} },
    orthography: { basis: "modern", spellings: {}, rules: [] },
    syllables: {
      classes: { C: { members: [], follows: "consonants", note: "All your consonants." }, V: { members: [], follows: "vowels", note: "All your vowels." } },
      declined: [],
      shapes: { any: [], initial: [], medial: [], final: [] },
      rootLength: { min: 1, max: 2, weights: {} }
    },
    partsOfSpeech: {},
    shapes: [],
    proto: { enabled: null, eras: [] },
    comfort: { learned: {} },
    meanings: [],
    lexicon: [],
    grammar: {},
    settings: { vetoRankedFirst: 200, blockNearTwins: false }
  };
}
// Objects whose keys are free (user-defined), so no "unknown field" warnings inside them.
const MAP_PATHS = new Set([
  "sounds.consonants", "sounds.vowels", "syllables.classes", "syllables.rootLength.weights",
  "partsOfSpeech", "comfort.learned", "grammar", "orthography.spellings"
]);
const SOUND_KEYS = ["label", "example", "audio", "group", "custom", "weight"];
const LEX_STATUS = ["live", "vetoed", "locked"];

// Characters a sound symbol can't contain: A–Z are class letters; the rest are rule and pattern notation (| is the meaning-sheet column separator).
const BAD_SYMBOL_CHARS = /[A-Z#_\/>∅…()|]/;
function badSymbolChar(sym) { const m = BAD_SYMBOL_CHARS.exec(String(sym)); return m ? m[0] : null; }

// Format migrations: MIGRATIONS[n] turns a version-n file into version n+1.
const MIGRATIONS = {
  // 1 → 2: add the spelling block. Nothing else changes.
  1: d => { if (!("orthography" in d)) d.orthography = { basis: "modern", spellings: {}, rules: [] }; return d; },
  // 2 → 3: classes get `follows` (replaces `auto`) and `note`; syllables get `declined`; the path is asked again
  // when no sound-change rules exist (the old default of true was never a real choice).
  2: d => {
    const cl = d.syllables && d.syllables.classes;
    if (isObj(cl)) for (const [L, c] of Object.entries(cl)) if (isObj(c)) {
      const f = c.auto === true ? (L === "C" ? "consonants" : L === "V" ? "vowels" : null) : null;

  try { localStorage.setItem("conlang-pipeline:test", "1"); localStorage.removeItem("conlang-pipeline:test"); } catch (e) { storageOK = false; }

  try { Object.assign(meta, JSON.parse(storeGet(META_KEY) || "{}")); } catch (e) {}
  try { Object.assign(ui, JSON.parse(storeGet(UI_KEY) || "{}")); } catch (e) {}
  const saveMeta = () => storeSet(META_KEY, JSON.stringify(meta));
  const saveUI = () => storeSet(UI_KEY, JSON.stringify(ui));

  function loadAutosave() {
    const raw = storeGet(STORE_KEY);
    if (!raw) return skeleton();
    let parsed;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = undefined; }
    const r = parsed === undefined ? { errors: ["Saved data is not valid JSON."], warnings: [] } : checkFile(parsed);
    if (r.errors.length) {
      const key = STORE_KEY + ":recovered-" + Date.now();
      storeSet(key, raw);
      startupNote = { err: true, text: `The autosaved language could not be read (${r.errors[0]}). A copy was kept in browser storage as "${key}", and a blank language was started.` };
      return skeleton();
    }
    if (r.warnings.length) startupNote = { err: false, text: `Autosave loaded with ${r.warnings.length} note(s). Open Menu → Diagnostics for details.` };
    return r.data;
  }
  lang = loadAutosave();

  /* ---- saving ---- */
  function setSaveState(text, bad) { const el = $("saveState"); el.textContent = text; el.classList.toggle("bad", !!bad); }
  function autosaveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!storageOK) { setSaveState("Autosave off", true); return; }
    syncAutoClasses(lang);
    refreshSurfaces(lang);
    if (storeSet(STORE_KEY, serialize(lang))) setSaveState("Saved");
    else setSaveState("Autosave failed", true);
  }
  // Veto undo snapshots hold the lexicon and learned values. Any edit outside the veto screen makes them stale
  // (restoring one would overwrite that edit), so they are dropped. keepVetoUndo: the edit can't conflict with them.
  let vetoUndo = []; // snapshots of { lexicon, comfort, idx } before each veto-screen action (this session only)
  function changed(keepVetoUndo) {
    if (!keepVetoUndo) vetoUndo = [];
    if (!meta.dirtySince) { meta.dirtySince = Date.now(); saveMeta(); }
    setSaveState("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autosaveNow, 250);
  }
  // A different language was loaded (Upload, New language): drop everything that belonged to the old one this session.
  function resetSession() { vetoUndo = []; ui.vetoNote = ""; ui.vetoIdx = 0; ui.genNotes = null; batch = null; openMeaningSheet.pending = null; }
  window.addEventListener("pagehide", () => { if (saveTimer) autosaveNow(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) autosaveNow(); });

  /* ---- banner ---- */
  function renderBanner() {
    const b = $("banner"); let html = "";
    if (startupNote) html += `<div class="banner${startupNote.err ? " err" : ""}"><span class="grow">${esc(startupNote.text)}</span><button data-bact="dismiss-note">OK</button></div>`;
    if (!storageOK) html += `<div class="banner err"><span class="grow">This browser isn't allowing autosave. Your work lives only in this tab until you export it.</span><button data-bact="export">Export</button></div>`;
    else if (!reminderDismissed && meta.dirtySince && Date.now() - meta.dirtySince > REMIND_AFTER_MS) {
      const days = Math.floor((Date.now() - meta.dirtySince) / 86400000);
      html += `<div class="banner"><span class="grow">You have changes from ${days} days ago that aren't in an exported file. Autosave lives in this browser only; clearing browser data wipes it.</span><button data-bact="export">Export now</button><button data-bact="dismiss-remind">Later</button></div>`;
    }
    b.innerHTML = html;
  }
  $("banner").addEventListener("click", e => {
    const a = e.target.closest("[data-bact]"); if (!a) return;
    if (a.dataset.bact === "dismiss-note") startupNote = null;
    if (a.dataset.bact === "dismiss-remind") reminderDismissed = true;
    if (a.dataset.bact === "export") exportFile();
    renderBanner();
  });

  /* ---- toast ---- */
  let toastTimer;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200); }

  /* ---- modal sheet ---- */
  function openSheet(html, onClick) {
    $("sheet").innerHTML = html; $("overlay").classList.add("show");
    $("sheet").onclick = onClick || null;
  }
  function closeSheet() { $("overlay").classList.remove("show"); $("sheet").innerHTML = ""; $("sheet").onclick = null; }
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("show")) closeSheet(); });

  /* ---- sound picker ---- */
  function soundEntry(kind, sym) { return lang.sounds[kind][sym]; }
  function tileHTML(kind, sym) {
    const e = soundEntry(kind, sym), c = CAT.get(sym), on = !!e;
    const label = e ? e.label : c.label, ex = e ? e.example : c.example;
    const custom = !c || (e && e.custom);
    return `<button class="tile${on ? " on" : ""}${custom ? " custom" : ""}" data-act="toggle" data-kind="${kind}" data-sym="${esc(sym)}" aria-pressed="${on}">
      <span class="slot">${e && e.audio ? `<span class="play" data-act="play" data-kind="${kind}" data-sym="${esc(sym)}" aria-label="Play">▶</span>` : ""}</span>
      ${on ? `<span class="corner"><span data-act="edit" data-kind="${kind}" data-sym="${esc(sym)}" aria-label="Edit">✎</span></span>` : ""}
      <span class="sym">${esc(sym)}</span>
      ${label ? `<span class="lab">${esc(label)}</span>` : ""}
      ${ex ? `<span class="ex">${esc(ex)}</span>` : ""}
    </button>`;
  }
  function miniHTML(kind, sym) {
    const e = soundEntry(kind, sym), c = CAT.get(sym);
    const label = e ? e.label : c.label, ex = e ? e.example : c.example;
    const custom = !c || (e && e.custom);
    return `<button class="mini${e ? " on" : ""}${custom ? " custom" : ""}" data-act="toggle" data-kind="${kind}" data-sym="${esc(sym)}" aria-pressed="${!!e}" title="${esc(label)}${ex ? " — " + esc(ex) : ""}">${esc(sym)}</button>`;
  }
  // Built-ins of this kind + every sound in the inventory not in the catalog (custom).
  function symbolsFor(kind) {
    const built = [...CAT.values()].filter(c => c.kind === kind).map(c => c.ipa);
    const extra = Object.keys(lang.sounds[kind]).filter(s => !CAT.has(s) || CAT.get(s).kind !== kind);
    return { built, extra };
  }
  function groupOf(kind, sym) { const e = soundEntry(kind, sym); return e ? e.group : CAT.get(sym).group; }

  function groupsView(kind) {
    const { built, extra } = symbolsFor(kind), all = built.concat(extra);
    let html = "";
    for (const g of GROUPS[kind]) {
      const syms = all.filter(s => groupOf(kind, s) === g.id);
      if (!syms.length) continue;
      html += `<h3>${esc(g.name)}</h3><p class="ghint">${esc(g.hint)}</p><div class="tiles">${syms.map(s => tileHTML(kind, s)).join("")}</div>`;
    }
    const other = all.filter(s => !GROUP_IDS[kind].has(groupOf(kind, s)));
    if (other.length) html += `<h3>Other</h3><p class="ghint">Sounds whose group this build doesn't know.</p><div class="tiles">${other.map(s => tileHTML(kind, s)).join("")}</div>`;
    return html;
  }
  function chartView(kind) {
    const { built, extra } = symbolsFor(kind);
    const cell = list => list.map(s => miniHTML(kind, s)).join("");
    let rows = "", head = "";
    if (kind === "consonants") {
      head = "<th></th>" + CHART.places.map(p => `<th>${p}</th>`).join("");
      for (const m of CHART.manners) {
        const any = built.some(s => CAT.get(s).manner === m);
        if (!any) continue;
        rows += `<tr><th>${m}</th>` + CHART.places.map(p => `<td>${cell(built.filter(s => CAT.get(s).manner === m && CAT.get(s).place === p))}</td>`).join("") + "</tr>";
      }
      const other = built.filter(s => !CHART.places.includes(CAT.get(s).place)).concat(extra);
      rows += `<tr><th>other</th><td colspan="${CHART.places.length}" style="text-align:left">${cell(other) || '<span class="muted">—</span>'}</td></tr>`;
    } else {
      head = "<th></th>" + CHART.backs.map(b => `<th>${b}</th>`).join("");
      for (const h of CHART.heights) {
        rows += `<tr><th>${h}</th>` + CHART.backs.map(b => {
          const here = built.filter(s => CAT.get(s).height === h && CAT.get(s).backness === b).sort((x, y) => CAT.get(x).rounded - CAT.get(y).rounded);
          return `<td>${cell(here)}</td>`;
        }).join("") + "</tr>";
      }
      rows += `<tr><th>other</th><td colspan="3" style="text-align:left">${cell(extra) || '<span class="muted">—</span>'}</td></tr>`;
    }
    const note = kind === "consonants"
      ? "Where two symbols share a cell, the voiceless one comes first. Dashed = your own sounds."
      : "Where two symbols share a cell, the unrounded one comes first. Dashed = your own sounds.";
    return `<div class="chartwrap"><table class="chart"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div><p class="chartnote">${note}</p>`;
  }
  function inventoryHTML() {
    const row = (kind, title) => {
      const syms = Object.keys(lang.sounds[kind]).sort((a, b) => (CAT.has(a) ? CAT.get(a).order : 1e5) - (CAT.has(b) ? CAT.get(b).order : 1e5));
      return `<div class="row"><b>${title} (${syms.length})</b>${syms.length
        ? syms.map(s => `<button class="chip${CAT.has(s) ? "" : " custom"}" data-act="edit" data-kind="${kind}" data-sym="${esc(s)}">${esc(s)}</button>`).join("")
        : '<span class="none">none yet</span>'}</div>`;
    };
    return `<div class="inv">${row("consonants", "Consonants")}${row("vowels", "Vowels")}<div class="tip">Tap a sound here to edit its label, example word or how common it is.</div></div>`;
  }
  /* ---- stages ---- */
  // Two paths (decision 19). Proto: Sounds → Syllables → Sound changes → Spelling → Samples → …; Modern: no sound-change stage.
  function stagesFor(L) {
    const proto = L.proto.enabled === true;
    const tail = [
      { id: "shapes", name: "Shape rules", built: true },
      { id: "generate", name: "Generate and assign meanings", built: true },
      { id: "veto", name: "Veto", built: true },
      { id: "grammar", name: "Grammar" }
    ];
    return proto ? [
      { id: "sounds", name: "Proto sounds", built: true },
      { id: "syllables", name: "Proto syllable rules", built: true },
      { id: "proto", name: "Sound changes", built: true },
      { id: "spelling", name: "Spelling", built: true },
      { id: "samples", name: "Sample words", built: true }
    ].concat(tail) : [
      { id: "sounds", name: "Sounds", built: true },
      { id: "spelling", name: "Spelling", built: true },
      { id: "syllables", name: "Syllable rules", built: true },
      { id: "samples", name: "Sample words", built: true }
    ].concat(tail);
  }
  let STAGES = [];
  function stageIndex() { const i = STAGES.findIndex(st => st.id === ui.stage && st.built); return i < 0 ? 0 : i; }
  function stageHead(i, intro) {
    return `<section class="stagehead"><button class="stagebtn" data-act="stages">Stage ${i + 1} of ${STAGES.length} ▾</button><h1>${esc(STAGES[i].name)}</h1><p>${intro}</p></section>`;
  }
  function stageNav(i) {
    const prev = STAGES[i - 1], next = STAGES[i + 1];
    return `<div class="stagenav">
      ${prev ? `<button class="btn" data-act="go" data-stage="${prev.id}">← ${esc(prev.name)}</button>` : ""}
      <span class="spacer"></span>
      ${next ? (next.built ? `<button class="btn primary" data-act="go" data-stage="${next.id}">${esc(next.name)} →</button>`
                          : `<span class="muted" style="font-size:14px">Next: <b>${esc(next.name)}</b>, in a later build</span>`) : ""}
    </div>`;
  }
  function goStage(id) { ui.stage = id; saveUI(); render(); window.scrollTo(0, 0); }
  function openStages() {
    const cur = stageIndex();
    openSheet(`<h2>Stages</h2>${STAGES.map((st, i) => `<button class="menuitem" data-s="${st.id}"${st.built ? "" : " disabled"}>${i + 1}. ${esc(st.name)}${i === cur ? ' <span class="muted">· you are here</span>' : ""}${st.built ? "" : "<small>Later build</small>"}</button>`).join("")}
      <div class="actions"><button class="btn" data-x="close">Close</button></div>`, ev => {
      if (ev.target.closest("[data-x]")) return closeSheet();
      const b = ev.target.closest("[data-s]"); if (!b || b.disabled) return;
      closeSheet(); goStage(b.dataset.s);
    });
  }

  function renderPath() {
    return `<section class="stagehead"><div class="step">Before you start</div><h1>How does your language begin?</h1>
        <p>This decides which stages you'll use. You can change it later from the menu.</p></section>
      <button class="pathcard" data-act="path" data-path="proto"><b>Develop from proto roots</b>
        <span class="blk">You pick the sounds and syllable rules of an older language. Sound changes then turn its words into the modern language, which gives natural-looking irregularity.</span>
        <span class="blk muted small">Proto sounds → Proto syllable rules → Sound changes → Spelling → Sample words → …</span></button>
      <button class="pathcard" data-act="path" data-path="modern"><b>Start modern</b>
        <span class="blk">The sounds and syllable rules you pick are the language as it's spoken today. No sound-change stage.</span>
        <span class="blk muted small">Sounds → Spelling → Syllable rules → Sample words → …</span></button>`;
  }
  function openChangePath() {
    const P = lang.proto, toModern = P.enabled === true, n = P.eras.reduce((k, e) => k + (isObj(e) && Array.isArray(e.changes) ? e.changes.length : 0), 0);
    openSheet(`<h2>Change path</h2>
      <p style="margin:0 0 8px">You're on the <b>${P.enabled === true ? "proto" : "modern"}</b> path.</p>
      <p class="muted small" style="margin:0">${toModern ? `Switching to modern: your sounds and syllable rules become the modern language. Your ${n} sound-change rule${n === 1 ? " is" : "s are"} kept but no longer used.` : "Switching to proto: your sounds and syllable rules become the older proto-language, and a Sound changes stage appears where you write the changes that turn it into the modern language."}</p>
      <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="go">Switch to ${toModern ? "modern" : "proto"}</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return; closeSheet();
      if (x.dataset.x === "go") commitWithLockCheck(L => { L.proto.enabled = !toModern; });
    });
  }

  function renderSounds(i) {
    const view = ui.soundView === "chart" ? "chart" : "groups";
    const body = kind => view === "chart" ? chartView(kind) : groupsView(kind);
    return `${stageHead(i, "Tap a sound to add it to your language. Nothing is picked for you.")}
      ${inventoryHTML()}
      <div class="toolbar">
        <div class="seg" role="group" aria-label="View">
          <button data-act="view" data-view="groups" class="${view === "groups" ? "on" : ""}">Plain groups</button>
          <button data-act="view" data-view="chart" class="${view === "chart" ? "on" : ""}">IPA chart</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" data-act="presets">Presets</button>
        <button class="btn primary" data-act="add">+ Add sound</button>
      </div>
      <h2>Consonants</h2>${body("consonants")}
      <h2>Vowels</h2>${body("vowels")}
      ${stageNav(i)}`;
  }

  /* ---- syllable rules ---- */
  const POS = [["any", "Any position"], ["initial", "First syllable"], ["medial", "Middle syllables"], ["final", "Last syllable"]];
  const fmtW = w => (Math.round(w * 10) / 10).toFixed(1);
  const sortSyms = arr => arr.slice().sort((a, b) => (CAT.has(a) ? CAT.get(a).order : 1e6) - (CAT.has(b) ? CAT.get(b).order : 1e6));
  function inventory() { return Object.assign({}, lang.sounds.consonants, lang.sounds.vowels); }
  function classSize(L) {
    const c = lang.syllables.classes[L];
    if (!isObj(c) || !Array.isArray(c.members)) return 0;
    const inv = inventory(); return c.members.filter(m => m in inv).length;
  }
  function shapeCount(shape) { return shape.split("").reduce((n, L) => n * classSize(L), 1); }
  function patternInfoHTML(pattern) {
    const r = expandPattern(pattern);
    if (r.error) return `<span class="blk err-text">${esc(r.error)}</span>`;
    const unknown = patternClasses(pattern).filter(L => !(L in lang.syllables.classes));
    const total = r.shapes.reduce((n, sh) => n + shapeCount(sh), 0);
    let h = `<span class="shapes">${r.shapes.map(sh => `<span class="shapechip"><b>${sh}</b> <span class="muted">${shapeCount(sh)}</span></span>`).join("")}</span>`;
    h += `<span class="blk muted small">${r.shapes.length} shape${r.shapes.length === 1 ? "" : "s"} · ${total} possible syllable${total === 1 ? "" : "s"}</span>`;
    if (unknown.length) h += `<span class="blk warn-text">No class named ${unknown.join(", ")} yet.</span>`;
    if (r.canBeEmpty) h += `<span class="blk muted small">Every part is optional; the empty syllable is ignored.</span>`;
    return h;
  }
  function patternsUsing(L) {
    const out = [];
    for (const [pos, name] of POS) lang.syllables.shapes[pos].forEach(e => { if (patternClasses(e.pattern).includes(L)) out.push(`${e.pattern} (${name})`); });
    return out;
  }
  function everSounds() { const ei = eraInventories(lang); return new Set([...ei.proto, ...ei.eras.flatMap(e => e.inventory)]); }
  function classesHTML() {
    const cl = lang.syllables.classes, inv = inventory();
    const keys = Object.keys(cl).sort((a, b) => (a === "C" ? -2 : a === "V" ? -1 : 0) - (b === "C" ? -2 : b === "V" ? -1 : 0) || a.localeCompare(b));
    let h = keys.map(L => {
      const c = cl[L], g = c.follows && GROUP_BY_ID[c.follows];
      const desc = `${c.note ? esc(c.note) + " · " : ""}${g ? `<span class="linked">follows your ${esc(g.name.toLowerCase())}</span>` : `${c.members.length} sound${c.members.length === 1 ? "" : "s"}`}`;
      const mem = c.members.length ? c.members.map(m => m in inv ? esc(m) : everSounds().has(m) ? `<span class="newm" title="Made by a sound change">${esc(m)}</span>` : `<s class="gone" title="Not in your sounds or made by any sound change">${esc(m)}</s>`).join(" ") : '<span class="muted small">no sounds yet</span>';
      return `<button class="rowcard" data-act="class" data-cls="${esc(L)}"><span class="clsL">${esc(L)}</span><span class="grow"><span class="blk muted small">${desc}</span><span class="blk members">${mem}</span></span><span class="muted">✎</span></button>`;
    }).join("");
    h += `<div class="toolbar"><button class="btn" data-act="addclass">+ Add your own class</button></div>`;
    return h + commonClassesHTML();
  }
  // Common classes panel (findings 1a, 4): every group with at least one of your sounds, and its status.
  function commonClassesHTML() {
    const cl = lang.syllables.classes, declined = lang.syllables.declined || [];
    const rows = CLASS_GROUPS.map(g => {
      const mem = groupMembers(lang, g.id);
      if (!mem.length) return "";
      const owner = Object.entries(cl).find(([, c]) => isObj(c) && c.follows === g.id);
      const memTxt = mem.map(m => g.id === "liquid" && RLIKE.test(m) && CAT.has(m) && CAT.get(m).manner === "fricative" ? `${esc(m)} <span class="muted small">(r-like)</span>` : esc(m)).join(" ");
      let status;
      if (owner) status = `<span class="okmark">✓ class ${esc(owner[0])}</span>`;
      else if (declined.includes(g.id)) status = `<button class="btn small" data-act="ccadd" data-g="${g.id}">Add back</button>`;
      else if (g.letter in cl) status = `<button class="btn small" data-act="ccadd" data-g="${g.id}">Add under another letter</button><span class="blk muted small">${g.letter} is your own class</span>`;
      else status = `<button class="btn small" data-act="ccadd" data-g="${g.id}">Add</button>`;
      return `<div class="ccrow"><span class="clsL">${g.letter}</span><span class="grow"><b>${esc(g.name)}</b> <span class="muted small">${esc(g.note)}</span><span class="blk members">${memTxt}</span></span><span class="ccst">${status}</span></div>`;
    }).join("");
    return rows ? `<details class="cc"${ui.ccOpen ? " open" : ""}><summary>Common classes for your sounds</summary><p class="muted small" style="margin:4px 0 6px">The usual class letters and which of your sounds fit. They're created for you and follow your sounds; edit or delete any of them.</p>${rows}</details>` : "";
  }
  function addGroupClass(gid, letter) {
    const g = GROUP_BY_ID[gid];
    commitWithLockCheck(n => {
      const sy = n.syllables;
      sy.declined = (sy.declined || []).filter(x => x !== gid);
      sy.classes[letter] = { members: groupMembers(n, gid), follows: gid, note: g.note };
    }, () => toast(`Added ${g.name} as ${letter}`));
  }
  function ccAdd(gid) {
    const g = GROUP_BY_ID[gid], cl = lang.syllables.classes;
    if (!(g.letter in cl)) return addGroupClass(gid, g.letter);
    openSheet(`<h2>Add ${esc(g.name)}</h2><p class="muted small" style="margin:0">${g.letter} is already one of your own classes. Pick another letter.</p>
      <label class="field"><span>Letter</span><input type="text" id="ccL" maxlength="1" class="ipa" autocapitalize="characters" autocomplete="off"></label><p class="err-text" id="ccErr"></p>
      <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="go">Add</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "cancel") return closeSheet();
      const L = $("ccL").value.trim().toUpperCase();
      if (!CLASS_RE.test(L)) { $("ccErr").textContent = "Pick one capital letter, A to Z."; return; }
      if (L in cl) { $("ccErr").textContent = `There's already a class ${L}.`; return; }
      closeSheet(); addGroupClass(gid, L);
    });
  }
  // What share each shape really gets in a position (finding 7): pattern by weight, shapes evenly, times learned; unusable shapes dropped.
  function positionShares(pos) {
    const sh = lang.syllables.shapes, list = sh[pos].length ? sh[pos] : sh.any;
    const m = shapeWeights(list); let total = 0;
    for (const [k, w] of [...m]) { if (!k.split("").every(L => classSize(L) > 0)) { m.delete(k); continue; } const v = w * Math.max(0.05, 1 + learnedOf(lang, k)); m.set(k, v); total += v; }
    return total ? [...m].map(([k, v]) => [k, v / total]).sort((a, b) => b[1] - a[1]) : [];
  }
  function sharesHTML(pos) {
    const sh = positionShares(pos); if (!sh.length) return "";

    return `${head}
      ${lang.proto.enabled === true ? `<h2>Spell from</h2>
      <p class="ghint">Which form of each word the spelling follows. Spelling from an older form keeps old distinctions on paper after the sounds merge (like French o / au / eau). Until sound changes exist, every choice gives the same result.</p>
      <div class="seg" role="group" aria-label="Spell from">${bases.map(([id, n]) => `<button data-act="basis" data-basis="${esc(id)}" class="${o.basis === id ? "on" : ""}">${esc(n)}</button>`).join("")}</div>` : ""}
      <h2>Letters</h2>
      <div id="spFlag">${spellFlagHTML()}</div>
      <div class="sptable">${rows}</div>
      <div class="toolbar"><button class="btn" data-act="spfill">Use the IPA symbol for every unspelled sound</button></div>
      <h2>Context rules</h2>
      <p class="ghint">Override the plain spelling in certain places, in the same notation as sound changes. <code>k > qu / _e</code> writes k as qu before e; <code>h > ∅ / _#</code> makes a final h silent. <code>#</code> is the start or end of the word, and class letters (C, V…) work in the context. Top to bottom, first match wins.</p>
      ${rules || '<p class="muted small">No rules yet.</p>'}
      <div class="toolbar"><button class="btn" data-act="addsprule">+ Add rule</button></div>
      <h2>Try it</h2>
      <label class="field"><span>Type a word in IPA</span><input type="text" id="tryIn" class="ipa" value="${esc(ui.tryWord || "")}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div id="spTry">${tryHTML()}</div>
      ${stageNav(i)}`;
  }
  function openSpRule(idx) {
    const isNew = idx == null, list = lang.orthography.rules;
    const r = isNew ? { rule: "", note: "" } : list[idx];
    openSheet(`<h2>${isNew ? "New spelling rule" : "Edit spelling rule"}</h2>
      <label class="field"><span>Rule</span><input type="text" id="rSrc" class="mono ipa" value="${esc(r.rule)}" placeholder="k > qu / _e" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      ${keypadHTML("rSrc", ["∅", "_", "#", ">", "/"])}
      <div id="rPrev" style="min-height:24px"></div>
      <label class="field"><span>Note (optional)</span><input type="text" id="rNote" value="${esc(r.note || "")}"></label>
      <p class="err-text" id="rErr"></p>
      <div class="actions">${isNew ? "" : '<button class="btn danger left" data-x="delete">Delete</button>'}<button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">Save</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "cancel") return closeSheet();
      if (x.dataset.x === "delete") { list.splice(idx, 1); changed(); closeSheet(); render(); return; }
      const src = $("rSrc").value.trim(), pr = parseRule(src, spellEnv(lang));
      if (pr.error) { $("rErr").textContent = pr.error; return; }
      const entry = { rule: src, note: $("rNote").value.trim() };
      if (isNew) list.push(entry); else list[idx] = entry;
      changed(); closeSheet(); render();
    });
    const prev = () => { const v = $("rSrc").value; $("rPrev").innerHTML = v.trim() ? ruleInfo(v) : ""; $("rErr").textContent = ""; };
    $("rSrc").addEventListener("input", prev); prev();
    if (isNew) setTimeout(() => { const el = $("rSrc"); if (el) el.focus(); }, 50);
  }

  /* ---- sample words ---- */
  const SAMPLE_COUNT = 20;
  let batch = null; // { sig, words, notes, error, fix } — throwaway, never saved
  const rulesSig = () => JSON.stringify([lang.sounds, lang.syllables, lang.shapes]); // samples follow sounds, syllable rules and shape rules (not sound changes, so they can be compared)
  function reroll() {
    const r = sampleWords(lang, SAMPLE_COUNT, (Math.random() * 4294967296) >>> 0);
    batch = Object.assign({ sig: rulesSig() }, r);
  }
  function starredEntry(proto) { return lang.lexicon.find(w => isObj(w) && w.source === "starred" && w.proto === proto); }
  function renderSamples(i) {
    if (!batch || batch.sig !== rulesSig()) reroll();
    const head = stageHead(i, "Words made from your sounds and syllable rules (shape rules apply too), to judge the feel. Star any you want to keep: they go into the lexicon locked, with no meaning yet. The rest vanish when you reroll.");
    if (batch.error) return `${head}<div class="warnline">${esc(batch.error)} <button class="linkbtn" data-act="go" data-stage="${batch.fix}">Go to ${batch.fix === "sounds" ? "Sounds" : "Syllable rules"}</button></div>${stageNav(i)}`;
    const starred = lang.lexicon.filter(w => isObj(w) && w.source === "starred");
    for (const w of batch.words) w.surface = deriveSurface(lang, w.proto);
    const cards = batch.words.map((w, k) => {
      const on = !!starredEntry(w.proto);
      const before = w.surface !== w.proto ? `<span class="blk muted small ipa">${esc(w.proto)} →</span>` : "";
      return `<div class="wcard${on ? " on" : ""}">
        <button class="star" data-act="star" data-k="${k}" aria-pressed="${on}" aria-label="${on ? "Unstar" : "Star"}">${on ? "★" : "☆"}</button>
        <button class="plain blk" data-act="trace" data-proto="${esc(w.proto)}">${before}<span class="blk word">${esc(spellProto(lang, w.proto))}</span><span class="blk muted small ipa">/${esc(w.surface)}/</span></button>
        <span class="blk muted small"><span class="ipa">${esc(w.syllables.join("·"))}</span> · ${esc(w.shapes.join("·"))}</span>
      </div>`;
    }).join("");
    return `${head}
      <div class="toolbar"><button class="btn primary" data-act="reroll">↻ Reroll</button><span class="muted small">${batch.words.length} words · ${starred.length} starred</span></div>
      ${batch.notes.map(n => `<div class="warnline" style="margin:6px 0">${esc(n)}</div>`).join("")}
      <div class="wgrid">${cards}</div>
      <h2>Starred words (${starred.length})</h2>
      <p class="ghint">Locked in the lexicon, waiting for a meaning. Tap one to remove it.</p>
      ${starred.length ? `<div class="inv"><div class="row">${starred.map(w => `<button class="chip" data-act="unstar" data-id="${esc(w.id)}">${esc(spellProto(lang, w.proto))}</button>`).join("")}</div></div>` : '<p class="muted small">None yet.</p>'}
      ${stageNav(i)}`;
  }
  function starToggle(k) {
    const w = batch && batch.words[k]; if (!w) return;
    const e = starredEntry(w.proto);
    if (e) lang.lexicon.splice(lang.lexicon.indexOf(e), 1);
    else lang.lexicon.push({ id: nextWordId(lang), proto: w.proto, surface: w.surface, slot: null, status: "locked", reviewed: false, source: "starred" });
    changed(); render();
  }
  function confirmUnstar(id) {
    const e = lang.lexicon.find(w => isObj(w) && w.id === id); if (!e) return;
    openSheet(`<h2>Remove <span class="ipa">${esc(e.surface)}</span>?</h2>
      <p style="margin:0">This word is locked. Removing it takes it out of the lexicon.</p>
      <div class="actions"><button class="btn" data-x="cancel">Keep it</button><button class="btn danger" data-x="remove">Remove</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "remove") { lang.lexicon.splice(lang.lexicon.indexOf(e), 1); changed(); render(); toast(`Removed ${e.surface}`); }
      closeSheet();
    });
  }

  function render() {
    $("langName").value = lang.language.name;
    syncAutoClasses(lang);
    refreshSurfaces(lang);
    STAGES = stagesFor(lang);
    const i = stageIndex();
    const id = STAGES[i].id;
    if (lang.proto.enabled !== true && lang.proto.enabled !== false) { $("main").innerHTML = renderPath(); renderBanner(); return; }
    $("main").innerHTML = id === "veto" ? renderVeto(i) : id === "generate" ? renderGenerate(i) : id === "shapes" ? renderShapes(i) : id === "proto" ? renderChanges(i) : id === "spelling" ? renderSpelling(i) : id === "syllables" ? renderSyllables(i) : id === "samples" ? renderSamples(i) : renderSounds(i);
    renderBanner();
  }

  function toggle(kind, sym) {
    const c = CAT.get(sym);
    if (!c || c.kind !== kind) { openEdit(kind, sym); return; } // custom sounds: edit, never lose by a tap
    commitWithLockCheck(n => {
      const map = n.sounds[kind];
      if (map[sym]) delete map[sym];
      else map[sym] = { label: c.label, example: c.example, audio: null, group: c.group, custom: false, weight: 1 };
    });
  }

  function groupOptions(kind, current) {
    let html = GROUPS[kind].map(g => `<option value="${g.id}"${g.id === current ? " selected" : ""}>${esc(g.name)}</option>`).join("");
    if (current && !GROUP_IDS[kind].has(current)) html += `<option value="${esc(current)}" selected>${esc(current)} (unknown)</option>`;
    return html;
  }

  function openEdit(kind, sym) {
    const e = soundEntry(kind, sym); if (!e) return;
    const c = CAT.get(sym), isBuilt = !!c && c.kind === kind && !e.custom;
    openSheet(`
      <h2><span class="ipa" style="font-size:30px">${esc(sym)}</span> <span class="muted" style="font-size:15px;font-weight:500">${kind === "consonants" ? "consonant" : "vowel"}${isBuilt ? "" : " · your own"}</span></h2>
      <label class="field"><span>Label (plain name)</span><input type="text" id="fLabel" value="${esc(e.label)}"></label>
      <label class="field"><span>Example word</span><input type="text" id="fExample" value="${esc(e.example)}"></label>
      ${isBuilt ? "" : `<label class="field"><span>Group</span><select id="fGroup">${groupOptions(kind, e.group)}</select></label>`}
      <label class="field"><span>How common: <b id="wOut">${e.weight.toFixed(1)}</b> <span id="wNote">${e.weight === 1 ? "(neutral)" : ""}</span>${learnedOf(lang, sym) ? ` <span class="learned">you: ${e.weight.toFixed(1)} · learned: ${learnedOf(lang, sym) > 0 ? "+" : ""}${learnedOf(lang, sym).toFixed(2)}</span> <button type="button" class="linkbtn" data-x="unlearn">reset learned</button>` : ""}<br><small>1.0 is neutral. "Learned" comes from your keeps and vetoes and is added on top.</small></span>
        <input type="range" id="fWeight" min="0.1" max="3" step="0.1" value="${e.weight}"></label>
      <div class="actions">
        <button class="btn danger left" data-x="remove">Remove sound</button>
        ${isBuilt ? '<button class="btn" data-x="reset">Reset text</button>' : ""}
        ${kind === "vowels" && !/ː$/.test(sym) && !lang.sounds.vowels[sym + "ː"] ? `<button class="btn" data-x="long">Add long version (${esc(sym)}ː)</button>` : ""}
        <button class="btn" data-x="cancel">Cancel</button>
        <button class="btn primary" data-x="save">Save</button>
      </div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      const act = x.dataset.x;
      if (act === "cancel") return closeSheet();
      if (act === "reset") { $("fLabel").value = c.label; $("fExample").value = c.example; return; }
      if (act === "long") {
        const ls = sym + "ː";
        closeSheet();
        commitWithLockCheck(n => { n.sounds.vowels[ls] = { label: `long ${e.label || sym}`, example: "", audio: null, group: e.group, custom: true, weight: 1 }; }, () => toast(`Added ${ls}`));
        return;
      }
      if (act === "unlearn") { delete lang.comfort.learned[sym]; changed(); closeSheet(); render(); toast(`Learned value for ${sym} reset`); return; }
      if (act === "remove") { closeSheet(); commitWithLockCheck(n => { delete n.sounds[kind][sym]; }, () => toast(`Removed ${sym}`)); return; }
      if (act === "save") {
        e.label = $("fLabel").value.trim();
        e.example = $("fExample").value.trim();
        if (!isBuilt) e.group = $("fGroup").value;
        e.weight = Math.round(parseFloat($("fWeight").value) * 10) / 10;
        changed(); closeSheet(); render();
      }
    });
    $("fWeight").addEventListener("input", ev => {
      const w = parseFloat(ev.target.value);
      $("wOut").textContent = w.toFixed(1); $("wNote").textContent = w === 1 ? "(neutral)" : "";
    });
  }

  function openAdd() {
    openSheet(`
      <h2>Add a sound</h2>
      <p class="muted" style="margin:0;font-size:14px">Any IPA symbol, including ones with marks (like aː, ẽ or tʼ). It joins its group like a built-in tile.</p>
      <label class="field"><span>Symbol</span><input type="text" id="aSym" class="ipa" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      ${keypadHTML("aSym", ["ː", "ʰ", "ʲ", "ʷ"])}
      <p class="muted small" style="margin:-4px 0 6px">A typed colon becomes ː (long).</p>
      <label class="field"><span>Kind</span><select id="aKind"><option value="consonants">Consonant</option><option value="vowels">Vowel</option></select></label>
      <label class="field"><span>Group</span><select id="aGroup">${groupOptions("consonants")}</select></label>
      <label class="field"><span>Label (plain name)</span><input type="text" id="aLabel"></label>
      <label class="field"><span>Example word</span><input type="text" id="aExample"></label>
      <p class="err-text" id="aErr"></p>
      <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="add">Add</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "cancel") return closeSheet();
      const sym = normSym($("aSym").value), kind = $("aKind").value;
      const err = t => { $("aErr").textContent = t; };
      if (!sym) return err("Type a symbol first.");
      if (/\s/.test(sym)) return err("A symbol can't contain spaces.");
      if (badSymbolChar(sym)) return err(/[A-Z]/.test(badSymbolChar(sym)) ? "Capital letters A–Z are class names, so a sound can't use them. IPA uses lowercase and special letters (like ʀ or ɴ)." : `A symbol can't contain "${badSymbolChar(sym)}": rules and patterns use it as notation.`);
      if (lang.sounds.consonants[sym] || lang.sounds.vowels[sym]) return err(`${sym} is already in your language.`);
      if (CAT.has(sym)) {
        const c = CAT.get(sym);
        return err(`${sym} is already a built-in tile (${c.label}) under ${GROUPS[c.kind].find(g => g.id === c.group).name}. Tap that tile instead.`);
      }
      const entry = { label: $("aLabel").value.trim(), example: $("aExample").value.trim(), audio: null, group: $("aGroup").value, custom: true, weight: 1 };
      closeSheet();
      commitWithLockCheck(n => { n.sounds[kind][sym] = entry; }, () => toast(`Added ${sym}`));
    });
    $("aKind").addEventListener("change", ev => { $("aGroup").innerHTML = groupOptions(ev.target.value); });
    setTimeout(() => { const el = $("aSym"); if (el) el.focus(); }, 50);
  }

  function applyPreset(p, mode) {
    let added = 0;
    closeSheet();
    commitWithLockCheck(n => {
      if (mode === "replace") { n.sounds.consonants = {}; n.sounds.vowels = {}; }
      for (const kind of ["consonants", "vowels"]) for (const sym of p[kind]) {
        if (n.sounds[kind][sym]) continue;
        const c = CAT.get(sym);
        n.sounds[kind][sym] = { label: c.label, example: c.example, audio: null, group: c.group, custom: false, weight: 1 };
        added++;
      }
    }, () => toast(mode === "replace" ? `Loaded ${p.name} sounds` : `Added ${added} sound(s) from ${p.name}`));
  }
  function openPresets() {
    const hasAny = Object.keys(lang.sounds.consonants).length + Object.keys(lang.sounds.vowels).length > 0;
    openSheet(`<h2>Presets</h2>
      <p class="muted" style="margin:0 0 6px;font-size:14px">Real-language sound sets to start from. Choosing one only ticks tiles; everything stays editable. Top 10 languages by total speakers.</p>
      ${PRESETS.map(p => `<button class="menuitem" data-p="${p.id}">${esc(p.name)} <span class="muted" style="font-size:14px">· ${p.consonants.length} consonants, ${p.vowels.length} vowels</span><small>${esc(p.note)}</small></button>`).join("")}
      <div class="actions"><button class="btn" data-x="cancel">Close</button></div>`, ev => {
      if (ev.target.closest("[data-x]")) return closeSheet();
      const b = ev.target.closest("[data-p]"); if (!b) return;
      const p = PRESETS.find(x => x.id === b.dataset.p);
      if (!hasAny) return applyPreset(p, "replace");
      openSheet(`<h2>${esc(p.name)}</h2>
        <p class="ipa" style="font-size:20px;line-height:1.6;margin:0 0 8px">${esc(p.consonants.join(" "))}<br>${esc(p.vowels.join(" "))}</p>
        <p style="margin:0">You already have sounds picked. <b>Add</b> ticks these on top of yours. <b>Replace</b> clears your sounds first, including your own sounds and any edits.</p>
        <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn danger" data-x="replace">Replace</button><button class="btn primary" data-x="add">Add</button></div>`, ev2 => {
        const x = ev2.target.closest("[data-x]"); if (!x) return;
        if (x.dataset.x === "cancel") return closeSheet();
        applyPreset(p, x.dataset.x);
      });
    });
  }

  $("main").addEventListener("click", ev => {
    const a = ev.target.closest("[data-act]"); if (!a) return;
    const { act, kind, sym } = a.dataset;
    if (act === "toggle") toggle(kind, sym);
    else if (act === "edit") { ev.stopPropagation(); openEdit(kind, sym); }
    else if (act === "play") {
      ev.stopPropagation();
      const e = soundEntry(kind, sym);
      if (e && e.audio) { try { new Audio(e.audio).play().catch(() => toast("Couldn't play that audio.")); } catch (er) { toast("Couldn't play that audio."); } }
    }
    else if (act === "view") { ui.soundView = a.dataset.view; saveUI(); render(); }
    else if (act === "add") openAdd();
    else if (act === "presets") openPresets();
    else if (act === "stages") openStages();
    else if (act === "go") goStage(a.dataset.stage);
    else if (act === "class") openClass(a.dataset.cls);
    else if (act === "addclass") openClass(null);
    else if (act === "path") { lang.proto.enabled = a.dataset.path === "proto"; ui.stage = "sounds"; changed(); render(); window.scrollTo(0, 0); }
    else if (act === "ccadd") ccAdd(a.dataset.g);
    else if (act === "patex") openPattern("any", null, a.dataset.p);
    else if (act === "copyany") {
      const sh = lang.syllables.shapes, pos = a.dataset.pos; let n = 0;
      for (const e of sh.any) if (!sh[pos].some(o => o.pattern === e.pattern)) { sh[pos].push({ pattern: e.pattern, weight: e.weight }); n++; }
      changed(); render(); toast(n ? `Copied ${n} pattern${n === 1 ? "" : "s"}` : "Already all here");
    }
    else if (act === "pattern") openPattern(a.dataset.pos, Number(a.dataset.idx));
    else if (act === "addpattern") openPattern(a.dataset.pos, null);
    else if (act === "showpos") { ui.showPositions = true; saveUI(); render(); }
    else if (act === "hidepos") { ui.showPositions = false; saveUI(); render(); }
    else if (act === "reroll") { reroll(); render(); }
    else if (act === "star") starToggle(Number(a.dataset.k));
    else if (act === "unstar") confirmUnstar(a.dataset.id);
    else if (act === "trace") openTrace(a.dataset.proto);
    else if (act === "shape") openShape(Number(a.dataset.idx));
    else if (act === "vkeep") vetoAct("keep");
    else if (act === "vveto") vetoAct("veto");
    else if (act === "vlock") vetoAct("lock");
    else if (act === "vundo") vetoUndoLast();
    else if (act === "vrestart") { ui.vetoIdx = 0; ui.vetoNote = ""; saveUI(); render(); window.scrollTo(0, 0); }
    else if (act === "starter") { loadStarterMeanings(lang); changed(); render(); toast("Starter list loaded"); }
    else if (act === "importm") openImport();
    else if (act === "addm") openMeaning(null);
    else if (act === "meaning") openMeaning(a.dataset.id);
    else if (act === "allm") { ui.allMeanings = !ui.allMeanings; saveUI(); render(); }
    else if (act === "posed") openPOS();
    else if (act === "calib") openCalibration();
    else if (act === "unlearnall") { lang.comfort.learned = {}; changed(); render(); toast("Learned values reset"); }
    else if (act === "gen") doGenerate();
    else if (act === "regen") {
      const live = lang.lexicon.filter(w => isObj(w) && w.status === "live"), kept = live.filter(w => w.reviewed).length;
      openSheet(`<h2>Regenerate unlocked words?</h2><p style="margin:0">This replaces ${live.length} unlocked word${live.length === 1 ? "" : "s"}${kept ? `, including ${kept} you marked Keep` : ""}. Locked and vetoed words stay (vetoed forms never come back).</p>
        <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="go">Regenerate</button></div>`, ev => {
        const x = ev.target.closest("[data-x]"); if (!x) return; closeSheet();
        if (x.dataset.x === "go") doRegenerate();
      });
    }
    else if (act === "addshape") openShape(null);
    else if (act === "change") openChange(Number(a.dataset.ei), Number(a.dataset.ci));
    else if (act === "addchange") openChange(Number(a.dataset.ei), null);
    else if (act === "era") openEra(Number(a.dataset.ei));
    else if (act === "addera") {
      const n = lang.proto.eras.length;
      lang.proto.eras.push({ id: nextEraId(lang), name: "", changes: [] }); changed(); render(); openEra(n);
    }
    else if (act === "chmove") {
      const ei = Number(a.dataset.ei), ci = Number(a.dataset.ci), cj = ci + Number(a.dataset.d);
      commitWithLockCheck(n => { const L = n.proto.eras[ei].changes; if (cj >= 0 && cj < L.length) [L[ci], L[cj]] = [L[cj], L[ci]]; });
    }
    else if (act === "basis") { lang.orthography.basis = a.dataset.basis; changed(); render(); }
    else if (act === "spfill") { for (const x of unspelledSounds(lang)) lang.orthography.spellings[x] = x; changed(); render(); }
    else if (act === "sprule") openSpRule(Number(a.dataset.idx));
    else if (act === "addsprule") openSpRule(null);
    else if (act === "spmove") {
      const L = lang.orthography.rules, k = Number(a.dataset.idx), j = k + Number(a.dataset.d);
      if (j >= 0 && j < L.length) { [L[k], L[j]] = [L[j], L[k]]; changed(); render(); }
    }
    else if (act === "rl") {
      const rl = lang.syllables.rootLength, d = Number(a.dataset.d), MAXLEN = 8;
      if (a.dataset.which === "min") rl.min = Math.max(1, Math.min(rl.max, rl.min + d));
      else rl.max = Math.max(rl.min, Math.min(MAXLEN, rl.max + d));
      changed(); render();
    }
  });
  $("main").addEventListener("input", ev => {
    const t = ev.target;
    if (t.dataset && t.dataset.rlw) {
      const n = t.dataset.rlw, w = Math.round(parseFloat(t.value) * 10) / 10;
      lang.syllables.rootLength.weights[n] = w;
      const out = document.querySelector(`[data-rlout="${n}"]`); if (out) out.textContent = fmtW(w);
      changed();
    }
    else if (t.dataset && t.dataset.sp) {
      const x = t.dataset.sp, v = t.value.normalize("NFC");
      if (v === "") delete lang.orthography.spellings[x]; else lang.orthography.spellings[x] = v;
      changed(); updateSpellLive();
    }
    else if (t.id === "tryIn") { ui.tryWord = t.value; updateSpellLive(); }
    else if (t.id === "chTry") { ui.chTry = t.value; const o = $("chTryOut"); if (o) o.innerHTML = t.value.trim() ? traceHTML(t.value.trim()) : ""; }
  });
  $("main").addEventListener("toggle", ev => { if (ev.target.classList && ev.target.classList.contains("cc") && ev.target.querySelector(".ccrow")) { ui.ccOpen = ev.target.open; saveUI(); } }, true);
  $("main").addEventListener("change", ev => {
    if (ev.target.id === "vAll") { ui.vetoAll = ev.target.checked; ui.vetoIdx = 0; ui.vetoNote = ""; saveUI(); render(); }
  });
  $("langName").addEventListener("input", ev => { lang.language.name = ev.target.value; changed(true); });

  /* ---- menu ---- */
  function exportFile() {
    const text = serialize(lang);
    const slug = (lang.language.name || "language").toLowerCase().normalize("NFKD").replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "") || "language";
    const d = new Date(), pad = n => String(n).padStart(2, "0");
    const name = `${slug}-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    meta.lastExport = Date.now(); meta.dirtySince = null; saveMeta(); reminderDismissed = false;
    renderBanner(); toast(`Exported ${name}`);
  }
  function listHTML(items) { return `<ul class="list">${items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`; }
  function resultHTML(r) {
    let h = "";
    if (r.errors.length) h += `<div class="errline"><b>${r.errors.length} problem(s)</b>${listHTML(r.errors)}</div>`;
    if (r.warnings.length) h += `<div class="warnline" style="margin-top:8px"><b>${r.warnings.length} note(s)</b>${listHTML(r.warnings)}</div>`;
    if (!r.errors.length && !r.warnings.length) h += `<div class="okline">All good. The file matches format version ${VERSION}.</div>`;
    return h;
  }
  function handleUpload(file) {
    file.text().then(text => {
      let parsed;
      try { parsed = JSON.parse(text); }
      catch (e) { openSheet(`<h2>Upload</h2><div class="errline">${esc(file.name)} is not valid JSON, so nothing was loaded.</div><div class="actions"><button class="btn" data-x="ok">OK</button></div>`, ev => { if (ev.target.closest("[data-x]")) closeSheet(); }); return; }
      const r = checkFile(parsed);
      if (r.errors.length) {
        openSheet(`<h2>Upload</h2><p style="margin:0 0 8px">${esc(file.name)} wasn't loaded. Your current work is unchanged.</p>${resultHTML(r)}<div class="actions"><button class="btn" data-x="ok">OK</button></div>`, ev => { if (ev.target.closest("[data-x]")) closeSheet(); });
        return;
      }
      const cur = lang.language.name || "Untitled language", next = r.data.language.name || "Untitled language";
      openSheet(`<h2>Load this file?</h2>
        <p style="margin:0 0 8px">This replaces <b>${esc(cur)}</b> with <b>${esc(next)}</b> from ${esc(file.name)}. Export first if you want to keep the current one.</p>
        ${r.warnings.length ? resultHTML(r) : ""}
        <div class="actions"><button class="btn left" data-x="export">Export current first</button><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="load">Load</button></div>`, ev => {
        const x = ev.target.closest("[data-x]"); if (!x) return;
        if (x.dataset.x === "export") { exportFile(); return; }
        if (x.dataset.x === "cancel") return closeSheet();
        lang = r.data; resetSession(); meta.dirtySince = null; saveMeta(); autosaveNow(); closeSheet(); render(); toast(`Loaded ${next}`);
      });
    });
  }
  $("fileInput").addEventListener("change", ev => { const f = ev.target.files[0]; ev.target.value = ""; if (f) handleUpload(f); });

  function openFileCheck() {
    const r = checkFile(JSON.parse(serialize(lang)));
    const n = k => Object.keys(lang.sounds[k]).length;
    const last = meta.lastExport ? new Date(meta.lastExport).toLocaleString() : "never";
    const slots = new Map(lang.meanings.map(m => [m.id, m])), words = slotHasWord(lang);
    const pct = x => (x > 0 && x < 0.01 ? "<1" : Math.round(x * 100)) + "%";
    const spell = w => esc(spellProto(lang, w.proto));
    const more = (list, k, f) => list.slice(0, k).map(f).join("") + (list.length > k ? `<span class="muted small"> and ${list.length - k} more</span>` : "");
    // 1. sound frequency
    const fq = soundFrequency(lang);
    const freqBlock = kind => {
      const rows = fq[kind]; if (!rows.length) return "";
      const max = Math.max(...rows.map(x => Math.max(x.expected, x.actual)), 0.0001);
      return `<h3>${kind === "consonants" ? "Consonants" : "Vowels"} <span class="muted small">(${fq[kind + "Total"]} in the lexicon)</span></h3>` + rows.map(x => {
        const off = fq[kind + "Total"] && x.expected >= 0.02 && (x.actual > x.expected * 2 || x.actual < x.expected / 2);
        return `<div class="freqrow${off ? " off" : ""}"><span class="ipa fsym">${esc(x.sym)}</span>
          <span class="bars"><span class="bar exp" style="width:${(x.expected / max * 100).toFixed(1)}%"></span><span class="bar act" style="width:${(x.actual / max * 100).toFixed(1)}%"></span></span>
          <span class="small fnum">${pct(x.expected)} → <b>${pct(x.actual)}</b></span></div>`;
      }).join("");
    };
    const freq = fq.words ? `<p class="muted small" style="margin:0 0 6px">Grey: what your sliders (plus learned) alone would give. Green: what's actually in your ${fq.words} words' proto-forms. Syllable patterns and classes also shape this, so some gap is normal; rows more than 2× off are marked.</p>${freqBlock("consonants")}${freqBlock("vowels")}` : '<p class="muted small">No words yet.</p>';
    // 2. near-twins
    const pairs = nearTwinPairs(lang);
    const gl = w => w.slot && slots.get(w.slot) ? esc(slots.get(w.slot).gloss) : "no meaning";
    const twins = pairs.length ? `<p class="muted small" style="margin:0 0 6px">${pairs.length} pair${pairs.length === 1 ? "" : "s"} of words one sound apart${lang.settings.blockNearTwins ? " (made before near-twins were blocked, or by sound changes)" : ""}.</p><div class="twinlist">${more(pairs, 40, ([x, y]) => `<div><b>${spell(x)}</b> <span class="muted small">${gl(x)}</span> · <b>${spell(y)}</b> <span class="muted small">${gl(y)}</span></div>`)}</div>` : '<p class="okline">No near-twins.</p>';
    // 3. meanings without words, words without meanings
    const noWord = lang.meanings.slice().sort((p, q) => p.rank - q.rank).filter(m => !words.has(m.id));
    const noMeaning = lang.lexicon.filter(w => isObj(w) && w.status !== "vetoed" && !(w.slot && slots.has(w.slot)));
    const gaps = `${noWord.length ? `<p style="margin:4px 0"><b>${noWord.length}</b> meaning${noWord.length === 1 ? "" : "s"} without a word:</p><div class="inv"><div class="row">${more(noWord, 40, m => `<span class="chip" style="font-family:inherit;font-size:14px">${esc(m.gloss)}</span>`)}</div></div>` : (lang.meanings.length ? '<p class="okline">Every meaning has a word.</p>' : '<p class="muted small">No meaning list yet.</p>')}
      ${noMeaning.length ? `<p style="margin:10px 0 4px"><b>${noMeaning.length}</b> word${noMeaning.length === 1 ? "" : "s"} without a meaning (starred words waiting, or words whose meaning moved):</p><div class="inv"><div class="row">${more(noMeaning, 40, w => `<span class="chip">${spell(w)}</span>`)}</div></div>` : ""}`;
    // 4. shape rules
    let shapes = '<p class="muted small">No shape rules.</p>';
    if (lang.shapes.length) {
      const st = shapeStats(lang, 1500);
      shapes = st.error ? `<p class="muted small">${esc(st.error)}</p>` : `<p style="margin:0 0 4px">All rules together reject <b>${pct(1 - st.pass)}</b> of candidates; about ${Math.round(st.space * st.pass).toLocaleString("en-US")} possible roots pass.</p>` +
        lang.shapes.map((x, k) => `<div class="small"><code>${esc(isObj(x) && x.settings ? x.settings.reject || "" : "")}</code> rejects ${pct(st.per[k] || 0)}</div>`).join("");
    }
    openSheet(`<h2>Diagnostics</h2>
      <h3>Overview</h3>
      <dl class="kv"><dt>Format</dt><dd>${FORMAT}, version ${VERSION}</dd>
      <dt>Sounds</dt><dd>${n("consonants")} consonants, ${n("vowels")} vowels</dd>
      <dt>Shape rules</dt><dd>${lang.shapes.length}</dd>
      <dt>Path</dt><dd>${lang.proto.enabled === true ? "proto (develop from proto roots)" : lang.proto.enabled === false ? "modern" : "not chosen yet"}</dd>
      <dt>Sound changes</dt><dd>${lang.proto.enabled === true ? "used" : "not used"}, ${lang.proto.eras.length} era(s), ${lang.proto.eras.reduce((n, e) => n + e.changes.length, 0)} rules</dd>
      <dt>Spelling</dt><dd>${invSorted().length - unspelledSounds(lang).length} of ${invSorted().length} sounds spelled, ${lang.orthography.rules.length} rules, from ${esc(lang.orthography.basis)}</dd>
      <dt>Syllables</dt><dd>${Object.keys(lang.syllables.classes).length} classes, ${["any","initial","medial","final"].reduce((n, p) => n + lang.syllables.shapes[p].length, 0)} patterns, roots ${lang.syllables.rootLength.min}–${lang.syllables.rootLength.max} syllables</dd>
      <dt>Meanings</dt><dd>${lang.meanings.length} (${Object.keys(lang.partsOfSpeech).length} parts of speech), ${words.size} with a word</dd>
      <dt>Lexicon</dt><dd>${lang.lexicon.length} entries: ${["live", "locked", "vetoed"].map(k => `${lang.lexicon.filter(w => isObj(w) && w.status === k).length} ${k}`).join(", ")}</dd>
      <dt>Last export</dt><dd>${esc(last)}</dd>
      <dt>Autosave</dt><dd>${storageOK ? "on (this browser)" : "off"}</dd>
      <dt>Tool</dt><dd>${BUILD}</dd></dl>
      <h3>File check</h3>${resultHTML(r)}
      <h3>Meanings and words</h3>${gaps}
      <h3>Near-twins</h3>${twins}
      <h3>Shape rules</h3>${shapes}
      <h3>Sound frequency</h3>${freq}
      <div class="actions"><button class="btn primary" data-x="ok">Done</button></div>`, ev => { if (ev.target.closest("[data-x]")) closeSheet(); });
  }
  function openNew() {
    openSheet(`<h2>Start a new language?</h2>
      <p style="margin:0">This clears <b>${esc(lang.language.name || "Untitled language")}</b> from this browser. Export it first if you want to keep it.</p>
      <div class="actions"><button class="btn left" data-x="export">Export first</button><button class="btn" data-x="cancel">Cancel</button><button class="btn danger" data-x="new">Start new</button></div>`, ev => {
      const x = ev.target.closest("[data-x]"); if (!x) return;
      if (x.dataset.x === "export") return exportFile();
      if (x.dataset.x === "cancel") return closeSheet();
      lang = skeleton(); resetSession(); meta.dirtySince = null; saveMeta(); autosaveNow(); closeSheet(); render(); toast("New language started");
    });
  }
  $("menuBtn").addEventListener("click", () => {
    openSheet(`<h2>Menu</h2>
      <button class="menuitem" data-m="export">Export language file<small>Download the .json file. Your real backup.</small></button>
      <button class="menuitem" data-m="upload">Upload language file<small>Restore a backup or move work from another device.</small></button>
      <button class="menuitem" data-m="msheet">Meaning sheet<small>Hand your words to an AI chat for meanings, then bring them back.</small></button>
      <button class="menuitem" data-m="settings">Settings<small>Veto order, near-twins.</small></button>
      ${lang.proto.enabled === true || lang.proto.enabled === false ? `<button class="menuitem" data-m="path">Change path<small>Now: ${lang.proto.enabled ? "develop from proto roots" : "start modern"}.</small></button>` : ""}
      <button class="menuitem" data-m="check">Diagnostics<small>Health check: file check, gaps, near-twins, shape rules, sound frequency.</small></button>
      <button class="menuitem" data-m="new">New language<small>Start from a blank file.</small></button>`, ev => {
      const m = ev.target.closest("[data-m]"); if (!m) return;
      const k = m.dataset.m; closeSheet();
      if (k === "export") exportFile();
      else if (k === "upload") $("fileInput").click();
      else if (k === "check") openFileCheck();
      else if (k === "msheet") openMeaningSheet();
      else if (k === "settings") openSettings();
      else if (k === "path") openChangePath();
      else if (k === "new") openNew();
    });
  });

  $("buildLine").textContent = `${BUILD} · made on: ${BASE_BUILD} · offline, no network calls`;
  setSaveState(storageOK ? (storeGet(STORE_KEY) ? "Saved" : "Not saved yet") : "Autosave off", !storageOK);
  render();
})();
</script>
</body>
</html>
