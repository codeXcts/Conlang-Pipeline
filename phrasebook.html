<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrasebook</title>
<link rel="stylesheet" href="core.css">
<style>
  .ph { font-size: 21px; font-weight: 700; }
  .ph .tw { cursor: pointer; border-bottom: 1px dotted var(--muted); }
  .say { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 4px; }
  .wbw { font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); margin: 2px 0 4px; }
  .mean { font-size: 16px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }
  .badge.Locked { background: var(--good-soft); color: var(--good); }
  .badge.Draft { background: var(--hl); color: var(--ink); }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { white-space: nowrap; }
  .ph-head { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
  .star { border: 0; background: none; padding: 0 2px; font-size: 20px; color: var(--muted); line-height: 1; }
  .star.on { color: #e0a400; }
  .acts { display: flex; gap: 6px; margin-top: 8px; }
  .acts a, .acts button { font-size: 12px; padding: 4px 9px; }
</style>
</head>
<body>
<header class="top">
  <div class="row" style="margin-bottom:8px">
    <h1 class="grow">Phrasebook</h1>
    <span class="muted" id="count"></span>
    <button id="imp" class="primary">Update</button>
  </div>
  <input id="q" type="search" placeholder="Search phrases (either language)…" style="width:100%; margin-bottom:8px" autocomplete="off">
  <div class="cats" id="cats"></div>
</header>
<main id="list"></main>

<script src="core.js"></script>
<script src="phrases.js"></script>
<script src="sentences.js"></script>
<script>
(() => {
  const { $, esc, store, fold, toast } = WL;
  const KEY = 'wl.phrasebook.md', STAR = 'wl.phrasebook.stars';

  const { DEFAULT_MD, parse } = PHRASES;

  let md = store.get(KEY, null) || DEFAULT_MD;
  const sentences = () => window.SENTENCES ? SENTENCES.load() : [];
  let items = [...parse(md), ...sentences()], cat = 'All', stars = new Set(store.get(STAR, []));
  const rebuild = () => { items = [...parse(md), ...sentences()]; renderCats(); render(); };
  if (window.SENTENCES) SENTENCES.refresh().then(rebuild);

  function renderCats() {
    const cats = ['All', '★', ...new Set(items.map(i => i.cat))];
    $('#cats').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
    $('#cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.c; renderCats(); render(); });
  }
  function render() {
    const q = fold($('#q').value.trim());
    const list = items.filter(i => (cat === 'All' || (cat === '★' ? stars.has(i.phrase) : i.cat === cat)) &&
      (!q || fold([i.phrase, i.wbw, i.meaning, i.note].join(' ')).includes(q)));
    $('#count').textContent = `${list.length} / ${items.length}`;
    let lastCat = '';
    $('#list').innerHTML = list.map(i => {
      const head = cat === 'All' && i.cat !== lastCat ? `<h2>${esc(i.cat)}</h2>` : '';
      lastCat = i.cat;
      return head + `<div class="card">
        <div class="ph-head"><div class="ph">${WL.tappable(i.phrase)}${i.say ? `<span class="say">(${esc(i.say)})</span>` : ''}${i.tag ? `<span class="badge ${i.tag}">${i.tag}</span>` : ''}</div>
          <button class="star ${stars.has(i.phrase) ? 'on' : ''}" data-p="${esc(i.phrase)}">${stars.has(i.phrase) ? '★' : '☆'}</button></div>
        ${i.wbw ? `<div class="wbw">${esc(i.wbw)}</div>` : ''}
        <div class="mean">${esc(i.meaning)}</div>
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
        <div class="acts"><a href="glosser.html?t=${encodeURIComponent(i.phrase)}"><button>Gloss</button></a>
          <button data-copy="${esc(i.phrase)}">Copy</button></div></div>`;
    }).join('') || '<div class="empty-state">No phrases match.</div>';
  }
  $('#list').addEventListener('click', e => {
    const tw = e.target.closest('.tw');
    if (tw) { if (!WL.words().length) return toast('Import the word list to see word details'); return WL.wordSheet(tw.dataset.w); }
    const st = e.target.closest('.star');
    if (st) { const p = st.dataset.p; stars.has(p) ? stars.delete(p) : stars.add(p); store.set(STAR, [...stars]); render(); return; }
    const cp = e.target.closest('[data-copy]');
    if (cp) navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('Copied'), () => toast('Copy not allowed here'));
  });
  $('#q').addEventListener('input', render);
  $('#imp').onclick = () => WL.importDialog({
    title: 'Update phrasebook', modes: false, accept: '.md,.txt',
    help: 'Load the latest <code>canon/phrasebook.md</code>, or a sentence sheet like <code>sentences.txt</code> (<code>English | Jotsom | also accepted | level</code>). Both feed the Quiz too. <a href="#" id="resetPB">Go back to the built-in copies</a>.',
    onText(t) {
      if (window.SENTENCES && SENTENCES.isSheet(t)) {
        const n = SENTENCES.setCustom(t); rebuild(); toast(`Loaded ${n} sentences`); return;
      }
      const p = parse(t); if (!p.length) { toast('No phrases or sentences found in that file'); return false; }
      md = t; store.set(KEY, md); rebuild(); toast(`Loaded ${p.length} phrases`); }
  });
  document.addEventListener('click', e => { if (e.target.id === 'resetPB') { e.preventDefault(); store.set(KEY, null); md = DEFAULT_MD; if (window.SENTENCES) SENTENCES.clearCustom(); rebuild(); toast('Back to built-in phrases and sentences'); } });
  renderCats(); render();
})();
</script>
</body>
</html>
